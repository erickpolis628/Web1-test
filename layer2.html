<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Phi</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%; height: 100%; overflow: hidden;
      background-color: #030308;
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #ffffff;
    }
    #space-canvas {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; z-index: 1;
    }
    #mobile-prompt {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 999999; background-color: #030308;
      display: none; flex-direction: column;
      justify-content: center; align-items: center;
      padding: 30px; text-align: center;
    }
    .mobile-title {
      font-size: 1.8rem; font-weight: 400;
      letter-spacing: 0.3rem; margin-bottom: 15px;
      text-shadow: 0 0 15px rgba(255,255,255,0.6);
    }
    .mobile-desc {
      font-size: 0.9rem; color: rgba(255,255,255,0.6);
      letter-spacing: 0.1rem; max-width: 320px; line-height: 1.6;
    }

    #layer2 {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; z-index: 3;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      opacity: 0;
      transition: opacity 1.4s ease;
      pointer-events: none;
    }
    #layer2.active { opacity: 1; pointer-events: auto; }

    .layer2-text {
      font-size: 2.4rem; font-weight: 300;
      letter-spacing: 0.35rem;
      color: #ffffff; text-align: center;
      text-shadow: 0 0 20px rgba(255,255,255,0.9), 0 0 40px rgba(200,220,255,0.4);
      z-index: 10; white-space: nowrap;
      padding-left: 0.35rem;
    }
    .type-cursor {
      display: inline-block; width: 3px; height: 1em;
      background-color: #ffffff; margin-left: 4px;
      vertical-align: -0.08em;
      box-shadow: 0 0 10px rgba(255,255,255,0.9), 0 0 20px rgba(200,220,255,0.6);
      animation: cursorBlink 0.85s ease-in-out infinite;
      border-radius: 2px;
    }
    .type-cursor.hidden { display: none; }
    .type-cursor.finished { animation: cursorFadeOut 1.2s ease-out forwards; }
    @keyframes cursorBlink {
      0%, 45% { opacity: 1; }
      50%, 95% { opacity: 0.15; }
      100% { opacity: 1; }
    }
    @keyframes cursorFadeOut {
      0% { opacity: 1; } 60% { opacity: 1; } 100% { opacity: 0; }
    }
    .typed-char {
      display: inline-block;
      animation: charAppear 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes charAppear {
      0% { opacity: 0; transform: translateY(6px) scale(0.9); filter: blur(6px); text-shadow: 0 0 30px rgba(255,255,255,1); }
      60% { opacity: 1; transform: translateY(0) scale(1.02); filter: blur(0.4px); }
      100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    /* Fade-in dari hitam saat halaman baru dimuat */
    #page-fader {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      background-color: #030308;
      z-index: 99998;
      opacity: 1; pointer-events: none;
      transition: opacity 0.8s ease;
    }
    #page-fader.out { opacity: 0; }
  </style>
</head>
<body>

  <canvas id="space-canvas"></canvas>

  <div id="mobile-prompt">
    <h2 class="mobile-title">Changes to Desktop</h2>
    <p class="mobile-desc">Not everything is visible on your vision</p>
  </div>

  <div id="layer2">
    <h1 class="layer2-text"><span id="typedTarget"></span><span class="type-cursor hidden" id="typeCursor"></span></h1>
  </div>

  <div id="page-fader"></div>

  <script>
    // --- DETEKSI PERANGKAT ---
    (function () {
      function checkDesktopLock() {
        const ua = navigator.userAgent || '';
        const isMobile = /Mobile|iPhone|iPod|Windows Phone|IEMobile|BlackBerry|Opera Mini|Opera Mobi|webOS/i.test(ua);
        const prompt = document.getElementById('mobile-prompt');
        if (!prompt) return;
        if (isMobile) {
          prompt.style.display = 'flex';
          document.body.style.overflow = 'hidden';
        } else {
          prompt.style.display = 'none';
          document.body.style.overflow = '';
        }
      }
      checkDesktopLock();
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', checkDesktopLock);
      window.addEventListener('resize', () => setTimeout(checkDesktopLock, 100));
      window.addEventListener('orientationchange', checkDesktopLock);
      window.addEventListener('pageshow', checkDesktopLock);
    })();

    // --- AUDIO (dijalankan secepat mungkin, fallback ke gesture) ---
    let audioCtx = null, isAudioActive = false;
    let pendingStart = false;

    function initAudio() {
      if (isAudioActive) return;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AC();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        isAudioActive = true;
        playOriginalSpaceAmbient();
        window.removeEventListener('click', initAudio);
        window.removeEventListener('keydown', initAudio);
        window.removeEventListener('touchstart', initAudio);
        window.removeEventListener('mousemove', initAudio);
        window.removeEventListener('scroll', initAudio);
      } catch (e) { /* ignore */ }
    }

    // Coba langsung (kadang lolos karena user baru interaksi di index.html)
    setTimeout(() => {
      if (!isAudioActive) {
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AC();
          if (audioCtx.state === 'suspended') {
            audioCtx.resume().then(() => {
              if (audioCtx.state === 'running') {
                isAudioActive = true;
                playOriginalSpaceAmbient();
              } else {
                pendingStart = true;
              }
            }).catch(() => { pendingStart = true; });
          } else {
            isAudioActive = true;
            playOriginalSpaceAmbient();
          }
        } catch (e) { pendingStart = true; }
      }
    }, 50);

    window.addEventListener('click', initAudio);
    window.addEventListener('keydown', initAudio);
    window.addEventListener('touchstart', initAudio);
    window.addEventListener('mousemove', initAudio);
    window.addEventListener('scroll', initAudio);

    function playOriginalSpaceAmbient() {
      const now = audioCtx.currentTime;
      const bufferSize = audioCtx.sampleRate * 2;
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
      const whiteNoise = audioCtx.createBufferSource();
      whiteNoise.buffer = noiseBuffer; whiteNoise.loop = true;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(140, now);
      const lfo = audioCtx.createOscillator();
      lfo.frequency.setValueAtTime(0.05, now);
      const lfoGain = audioCtx.createGain();
      lfoGain.gain.setValueAtTime(80, now);
      lfo.connect(lfoGain); lfoGain.connect(filter.frequency);
      const masterGain = audioCtx.createGain();
      masterGain.gain.setValueAtTime(0.0001, now);
      masterGain.gain.linearRampToValueAtTime(0.25, now + 3.0);
      whiteNoise.connect(filter); filter.connect(masterGain);
      masterGain.connect(audioCtx.destination);
      whiteNoise.start(now); lfo.start(now);
    }

    function playTypeTick() {
      if (!audioCtx || !isAudioActive) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1400 + Math.random() * 400, now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(0.02, now + 0.005);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.06);
    }

    // --- CANVAS STARFIELD (IDENTIK dengan index.html) ---
    const canvas = document.getElementById('space-canvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;
    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const angleRad = (180 + 35) * Math.PI / 180;
    const moveSpeed = 0.12;
    const vx = Math.cos(angleRad) * moveSpeed;
    const vy = Math.sin(angleRad) * moveSpeed;

    const STAR_COUNT = 300;
    let stars = [];
    const starColors = [
      { r: 255, g: 255, b: 255 },
      { r: 235, g: 242, b: 255 },
      { r: 255, g: 245, b: 220 },
      { r: 210, g: 230, b: 255 }
    ];
    function initStars() {
      stars = [];
      for (let i = 0; i < STAR_COUNT; i++) {
        const color = starColors[Math.floor(Math.random() * starColors.length)];
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() < 0.85 ? Math.random() * 1.2 + 0.3 : Math.random() * 2.2 + 1.2,
          color: color,
          baseAlpha: Math.random() * 0.5 + 0.3,
          twinkleSpeed: Math.random() * 0.015 + 0.005,
          twinklePhase: Math.random() * Math.PI * 2,
          hasFlare: Math.random() < 0.15
        });
      }
    }
    function renderStarfield() {
      for (let i = 0; i < stars.length; i++) {
        const star = stars[i];
        const currentAlpha = Math.max(0.1, star.baseAlpha + Math.sin(star.twinklePhase) * 0.25);
        const rad = star.radius;
        const g = ctx.createRadialGradient(star.x, star.y, 0, star.x, star.y, rad * 2.5);
        g.addColorStop(0, `rgba(${star.color.r}, ${star.color.g}, ${star.color.b}, ${currentAlpha})`);
        g.addColorStop(0.4, `rgba(${star.color.r}, ${star.color.g}, ${star.color.b}, ${currentAlpha * 0.5})`);
        g.addColorStop(1, `rgba(${star.color.r}, ${star.color.g}, ${star.color.b}, 0)`);
        ctx.beginPath();
        ctx.fillStyle = g;
        ctx.arc(star.x, star.y, rad * 2.5, 0, Math.PI * 2);
        ctx.fill();
        if (star.hasFlare && star.radius > 1.5) {
          ctx.strokeStyle = `rgba(${star.color.r}, ${star.color.g}, ${star.color.b}, ${currentAlpha * 0.35})`;
          ctx.lineWidth = 0.5;
          const fl = star.radius * 4;
          ctx.beginPath();
          ctx.moveTo(star.x - fl, star.y); ctx.lineTo(star.x + fl, star.y);
          ctx.moveTo(star.x, star.y - fl); ctx.lineTo(star.x, star.y + fl);
          ctx.stroke();
        }
      }
    }
    function animate() {
      for (let i = 0; i < stars.length; i++) {
        const s = stars[i];
        s.x += vx; s.y += vy; s.twinklePhase += s.twinkleSpeed;
        if (s.x < -10) s.x = width + 10;
        if (s.y < -10) s.y = height + 10;
      }
      ctx.clearRect(0, 0, width, height);
      renderStarfield();
      requestAnimationFrame(animate);
    }
    initStars();
    animate();

    // --- ANIMASI KETIK ---
    const typedTarget = document.getElementById('typedTarget');
    const typeCursor = document.getElementById('typeCursor');
    const layer2 = document.getElementById('layer2');
    const fader = document.getElementById('page-fader');
    let typingStarted = false;

    function typeText(text) {
      if (typingStarted) return;
      typingStarted = true;
      typeCursor.classList.remove('hidden');
      let i = 0;
      function step() {
        if (i >= text.length) {
          setTimeout(() => typeCursor.classList.add('finished'), 550);
          return;
        }
        const ch = text.charAt(i);
        const span = document.createElement('span');
        span.className = 'typed-char';
        span.textContent = ch === ' ' ? '\u00A0' : ch;
        typedTarget.appendChild(span);
        if (ch !== ' ') playTypeTick();
        i++;
        let delay = 85 + Math.random() * 55;
        if (ch === ' ') delay = 60 + Math.random() * 30;
        if (ch === ',' || ch === '.') delay += 180;
        setTimeout(step, delay);
      }
      setTimeout(step, 450);
    }

    // Mulai: fade-in halaman + tampilkan layer2 + mulai mengetik
    window.addEventListener('load', () => {
      // Fade hitam keluar
      requestAnimationFrame(() => {
        fader.classList.add('out');
      });

      // Tampilkan layer2 (fade in teks)
      setTimeout(() => {
        layer2.classList.add('active');
      }, 350);

      // Mulai mengetik
      setTimeout(() => {
        typeText('Are You Sure?');
      }, 900);
    });
  </script>
</body>
</html>
