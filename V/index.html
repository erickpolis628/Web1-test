<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V</title>
<style>
  /* ============================================================
     FONT
     Ganti nama file di bawah dengan file font yang ada di repo:
     https://erickpolis628.github.io/Web1-test/
     ============================================================ */
  @font-face{
    font-family: 'Web1Font';
    src: url('https://erickpolis628.github.io/Web1-test/font.woff2') format('woff2'),
         url('https://erickpolis628.github.io/Web1-test/font.woff')  format('woff'),
         url('https://erickpolis628.github.io/Web1-test/font.ttf')   format('truetype');
    font-display: swap;
  }

  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }

  html, body{
    height:100%;
    background:#000;
    overflow:hidden;
  }

  body{
    font-family:'Web1Font', 'Courier New', Courier, monospace;
    -webkit-user-select:none;
    user-select:none;
  }

  /* ---------- OVERLAY / TOMBOL "V" ---------- */
  #overlay{
    position:fixed;
    inset:0;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:10;
    cursor:pointer;
    opacity:1;
    /* 1.2s = FADE_TIME */
    transition:opacity 1.2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  #overlay.hide{
    opacity:0;
    pointer-events:none;
  }

  #playBtn{
    font-family:inherit;
    font-size:clamp(3rem, 13vw, 9rem);
    letter-spacing:.08em;
    color:#fff;
    background:none;
    border:none;
    outline:none;
    cursor:pointer;
    text-transform:uppercase;
    animation:pulse 2.4s ease-in-out infinite;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color: transparent;
    -webkit-appearance:none;
    appearance:none;
    touch-action: manipulation;
  }
  #playBtn:focus,
  #playBtn:active,
  #playBtn:focus-visible{
    outline:none;
    border:none;
    background:none;
    -webkit-tap-highlight-color: transparent;
    box-shadow:none;
  }

  @keyframes pulse{
    0%,100%{ opacity:.5; text-shadow:0 0 0 rgba(255,255,255,0); }
    50%    { opacity:1;  text-shadow:0 0 26px rgba(255,255,255,.45); }
  }

  /* ---------- PANGGUNG ANIMASI ---------- */
  #stage{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    overflow:hidden;
    opacity:0;
    /* 1.2s = FADE_TIME */
    transition:opacity 1.2s ease;
    background:#000;
    pointer-events:none;
  }
  #stage.show{ opacity:1; }

  .track{
    display:flex;
    flex:none;
    will-change:transform;
  }

  .chunk{
    flex:none;
    white-space:nowrap;
    font-size:clamp(0.95rem, 2.1vw, 1.55rem);
    letter-spacing:.09em;
    color:#e9e9e9;
    line-height:1;
    padding-right:1px;
  }

  .chunk .link{
    color:#ff2b2b;
    text-shadow:0 0 10px rgba(255,0,0,.55);
  }
</style>
</head>
<body>

  <!-- ================= OVERLAY TOMBOL "V" ================= -->
  <div id="overlay">
    <button id="playBtn" type="button">V</button>
  </div>

  <!-- ================= ANIMASI TEKS ================= -->
  <div id="stage">
    <div class="track" id="track"></div>
  </div>

<script>
(function () {
  'use strict';

  /* ============================================================
     KONFIGURASI WAKTU
     Total siklus dari "V awal" sampai "V akhir" muncul kembali = 52 s
     Urutan:
       0.0s          -> V mulai fade-out, stage fade-in (bersamaan)
       1.2s          -> fade selesai, teks mulai bergerak
       1.2s + D      -> teks selesai, stage mulai fade-out
       2.4s + D      -> stage hilang, V mulai fade-in
       3.6s + D      -> V terlihat penuh = "V akhir"
     Jadi:  3.6 + D = 52  ->  D = 48.4 detik (durasi scroll)
     ============================================================ */
  const TOTAL_CYCLE = 52;                          // detik total (V awal -> V akhir)
  const FADE_TIME   = 1.2;                         // harus sama dengan transition CSS
  const SCROLL_TIME = TOTAL_CYCLE - FADE_TIME * 3; // = 48.4 detik

  // Jika disatukan urut -> https://erickpolis628.github.io/Web1-test/
  const FRAGMENTS = ['https://', 'erickpolis', '628.github', '.io/Web1', '-test/'];

  const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#&$%()+:@;?!*^~<>=';

  /* ---------- HELPER ---------- */
  function randStr(min, max) {
    const n = min + Math.floor(Math.random() * (max - min + 1));
    let s = '';
    for (let i = 0; i < n; i++) {
      s += CHARS.charAt(Math.floor(Math.random() * CHARS.length));
    }
    return s;
  }

  /* ---------- BANGUN SATU BLOK TEKS ---------- */
  function buildChunk() {
    const el = document.createElement('span');
    el.className = 'chunk';

    const addText = (t) => el.appendChild(document.createTextNode(t));
    const addLink = (t) => {
      const s = document.createElement('span');
      s.className = 'link';
      s.textContent = t;
      el.appendChild(s);
    };

    addText(randStr(120, 200));

    for (let i = 0; i < FRAGMENTS.length; i++) {
      addLink(FRAGMENTS[i]);
      if (i < FRAGMENTS.length - 1) {
        addText(randStr(8, 16));
      }
    }

    addText(randStr(120, 200));

    return el;
  }

  const overlay = document.getElementById('overlay');
  const playBtn = document.getElementById('playBtn');
  const stage   = document.getElementById('stage');
  const track   = document.getElementById('track');

  let chunk = null;
  let animationTimer = null;
  let resetTimer     = null;

  /* ---------- MULAI SATU PUTARAN ANIMASI ---------- */
  function startRound() {
    if (animationTimer) { clearTimeout(animationTimer); animationTimer = null; }
    if (resetTimer)     { clearTimeout(resetTimer);     resetTimer     = null; }

    track.innerHTML = '';
    chunk = buildChunk();
    track.appendChild(chunk);

    overlay.classList.add('hide');
    stage.classList.add('show');

    const run = () => {
      const chunkWidth = chunk.scrollWidth;
      const vw         = window.innerWidth;

      const startX = vw;
      const endX   = -chunkWidth;

      // Posisi awal (di luar kanan layar)
      track.style.transition = 'none';
      track.style.transform  = 'translateX(' + startX + 'px)';

      // Paksa reflow supaya transisi terpicu
      void track.offsetWidth;

      // Geser ke kiri dengan durasi TETAP = SCROLL_TIME (48.4 s)
      track.style.transition = 'transform ' + SCROLL_TIME + 's linear';
      track.style.transform  = 'translateX(' + endX + 'px)';

      // Setelah scroll selesai:
      //   +0.0s  -> stage mulai fade-out
      //   +1.2s  -> V mulai fade-in
      //   +2.4s  -> V terlihat penuh (V akhir)  =>  total = 52s
      animationTimer = setTimeout(() => {
        stage.classList.remove('show');
        resetTimer = setTimeout(() => {
          overlay.classList.remove('hide');
        }, FADE_TIME * 1000);
      }, SCROLL_TIME * 1000);
    };

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(run);
    } else {
      run();
    }
  }

  /* ---------- INTERAKSI TOMBOL "V" ---------- */
  function handleStart() {
    if (stage.classList.contains('show')) return;
    startRound();
  }

  overlay.addEventListener('pointerdown', (e) => { e.preventDefault(); handleStart(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') handleStart();
  });
})();
</script>
</body>
</html>
