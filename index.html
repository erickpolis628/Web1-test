<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Phi</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600&display=swap');

    /* ============ ANTI-COPY SUPER KETAT ============ */
    *, *::before, *::after {
      -webkit-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
      user-select: none !important;
      -webkit-touch-callout: none !important;
      -webkit-user-drag: none !important;
      -khtml-user-select: none !important;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background-color: #030308;
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #ffffff;
      -webkit-tap-highlight-color: transparent;
    }

    #space-canvas {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; z-index: 1;
    }

    #mobile-prompt {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 999999; background-color: #030308;
      display: none; flex-direction: column;
      justify-content: center; align-items: center;
      padding: 30px; text-align: center;
    }
    .mobile-title {
      font-size: 1.8rem; font-weight: 400;
      letter-spacing: 0.3rem; margin-bottom: 15px;
      text-shadow: 0 0 15px rgba(255,255,255,0.6);
    }
    .mobile-desc {
      font-size: 0.9rem; color: rgba(255,255,255,0.6);
      letter-spacing: 0.1rem; max-width: 320px; line-height: 1.6;
    }

    #screen1 {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; z-index: 2;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      opacity: 1; pointer-events: auto;
      transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #screen1.hidden { opacity: 0; pointer-events: none; }

    .input-wrapper {
      position: relative; display: flex;
      flex-direction: column; align-items: center;
    }

    .secret-input {
      background: transparent; border: none; outline: none;
      color: transparent;
      -webkit-text-fill-color: transparent;
      font-family: 'Space Grotesk', monospace;
      font-size: 2.2rem; letter-spacing: 0.6rem;
      text-align: center; padding: 10px 20px;
      width: 280px;
      caret-color: transparent !important;
      -webkit-caret-color: transparent !important;
    }

    .display-text {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      font-family: 'Space Grotesk', monospace;
      font-size: 2.2rem; letter-spacing: 0.6rem;
      text-align: center;
      color: rgba(255,255,255,0.9);
      white-space: nowrap;
    }
    .display-text.placeholder {
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.5rem;
    }

    .error-msg {
      position: absolute; top: 100%; margin-top: 15px;
      color: #ff3344; font-size: 0.85rem;
      letter-spacing: 0.25rem; text-transform: uppercase;
      opacity: 0; transition: opacity 0.3s ease;
      pointer-events: none;
      text-shadow: 0 0 10px rgba(255,51,68,0.8);
      white-space: nowrap;
    }
    .error-msg.visible { opacity: 1; }

    #screen2 {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; z-index: 3;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      opacity: 0; pointer-events: none;
      transition: opacity 1.4s cubic-bezier(0.4, 0, 0.2, 1) 0.25s;
      cursor: pointer;
    }
    #screen2.active {
      opacity: 1; pointer-events: auto;
    }

    .screen2-text {
      font-size: 2.4rem; font-weight: 300;
      letter-spacing: 0.35rem;
      color: #ffffff; text-align: center;
      text-shadow: 0 0 20px rgba(255,255,255,0.9), 0 0 40px rgba(200,220,255,0.4);
      z-index: 10; white-space: nowrap;
      padding-left: 0.35rem;
      min-height: 1em;
    }

    .type-cursor {
      display: inline-block; width: 3px; height: 1em;
      background-color: #ffffff; margin-left: 4px;
      vertical-align: -0.08em;
      box-shadow: 0 0 10px rgba(255,255,255,0.9), 0 0 20px rgba(200,220,255,0.6);
      animation: cursorBlink 0.85s ease-in-out infinite;
      border-radius: 2px;
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }
    .type-cursor.hidden { display: none; }
    .type-cursor.finished { animation: cursorFadeOut 1.5s ease-out forwards; }
    .type-cursor.ready {
      transform: scale(1.4);
      box-shadow: 0 0 14px rgba(255,255,255,1), 0 0 28px rgba(200,220,255,0.9);
    }

    @keyframes cursorBlink {
      0%, 45% { opacity: 1; }
      50%, 95% { opacity: 0.15; }
      100% { opacity: 1; }
    }
    @keyframes cursorFadeOut {
      0% { opacity: 1; } 60% { opacity: 1; } 100% { opacity: 0; }
    }

    .typed-char {
      display: inline-block;
      animation: charAppear 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes charAppear {
      0% { opacity: 0; transform: translateY(6px) scale(0.9); filter: blur(6px); text-shadow: 0 0 30px rgba(255,255,255,1); }
      60% { opacity: 1; transform: translateY(0) scale(1.02); filter: blur(0.4px); }
      100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }
  </style>
</head>
<body>

  <canvas id="space-canvas"></canvas>

  <div id="mobile-prompt">
    <h2 class="mobile-title">Changes to Desktop</h2>
    <p class="mobile-desc">Not everything is visible on your vision</p>
  </div>

  <div id="screen1">
    <div class="input-wrapper">
      <div class="display-text placeholder" id="displayText">......</div>
      <input type="text" id="codeInput" class="secret-input" autocomplete="off" spellcheck="false" maxlength="20" draggable="false">
      <div id="errorMsg" class="error-msg">Access Denied</div>
    </div>
  </div>

  <div id="screen2">
    <h1 class="screen2-text"><span id="typedTarget"></span><span class="type-cursor hidden" id="typeCursor"></span></h1>
  </div>

<script>
  // ===================================================================
  // ANTI-COPY
  // ===================================================================
  (function () {
    document.addEventListener('contextmenu', (e) => { e.preventDefault(); e.stopPropagation(); return false; }, true);
    document.addEventListener('selectstart', (e) => { e.preventDefault(); return false; }, true);
    document.addEventListener('mousedown', (e) => { if (e.detail > 1) { e.preventDefault(); return false; } }, true);
    document.addEventListener('dragstart', (e) => { e.preventDefault(); return false; }, true);
    document.addEventListener('drop', (e) => { e.preventDefault(); return false; }, true);
    document.addEventListener('copy', (e) => { e.preventDefault(); if (e.clipboardData) e.clipboardData.setData('text/plain', ''); return false; }, true);
    document.addEventListener('cut', (e) => { e.preventDefault(); if (e.clipboardData) e.clipboardData.setData('text/plain', ''); return false; }, true);
    document.addEventListener('paste', (e) => e.preventDefault(), true);
    document.addEventListener('keydown', (e) => {
      const k = (e.key || '').toLowerCase();
      if ((e.ctrlKey || e.metaKey) && ['c','a','x','u','s','p'].includes(k)) { e.preventDefault(); e.stopPropagation(); return false; }
      if (e.key === 'F12') { e.preventDefault(); return false; }
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && ['i','j','c'].includes(k)) { e.preventDefault(); return false; }
      if ((e.ctrlKey || e.metaKey) && e.key === 'U') { e.preventDefault(); return false; }
    }, true);
    setInterval(() => {
      const sel = window.getSelection && window.getSelection();
      if (sel && sel.rangeCount > 0 && String(sel).length > 0) sel.removeAllRanges();
    }, 200);
  })();

  // ===================================================================
  // DETEKSI PERANGKAT
  // ===================================================================
  (function () {
    function checkDesktopLock() {
      const ua = navigator.userAgent || '';
      const isMobile = /Mobile|iPhone|iPod|Windows Phone|IEMobile|BlackBerry|Opera Mini|Opera Mobi|webOS/i.test(ua);
      const prompt = document.getElementById('mobile-prompt');
      if (!prompt) return;
      if (isMobile) { prompt.style.display = 'flex'; document.body.style.overflow = 'hidden'; }
      else { prompt.style.display = 'none'; document.body.style.overflow = ''; }
    }
    checkDesktopLock();
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', checkDesktopLock);
    window.addEventListener('resize', () => setTimeout(checkDesktopLock, 100));
    window.addEventListener('orientationchange', checkDesktopLock);
    window.addEventListener('pageshow', checkDesktopLock);
  })();

  // ===================================================================
  // AUDIO
  // ===================================================================
  let audioCtx = null, isAudioActive = false;

  function initAudio() {
    if (isAudioActive) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    isAudioActive = true;
    playOriginalSpaceAmbient();
    window.removeEventListener('click', initAudio);
    window.removeEventListener('keydown', initAudio);
    window.removeEventListener('touchstart', initAudio);
    window.removeEventListener('mousemove', initAudio);
  }

  function playOriginalSpaceAmbient() {
    const now = audioCtx.currentTime;
    const bufferSize = audioCtx.sampleRate * 2;
    const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
    const whiteNoise = audioCtx.createBufferSource();
    whiteNoise.buffer = noiseBuffer; whiteNoise.loop = true;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(140, now);
    const lfo = audioCtx.createOscillator();
    lfo.frequency.setValueAtTime(0.05, now);
    const lfoGain = audioCtx.createGain();
    lfoGain.gain.setValueAtTime(80, now);
    lfo.connect(lfoGain); lfoGain.connect(filter.frequency);
    const masterGain = audioCtx.createGain();
    masterGain.gain.setValueAtTime(0.0001, now);
    masterGain.gain.linearRampToValueAtTime(0.25, now + 3.0);
    whiteNoise.connect(filter); filter.connect(masterGain);
    masterGain.connect(audioCtx.destination);
    whiteNoise.start(now); lfo.start(now);
  }

  function playGlitchSound() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(110, now);
    osc.frequency.linearRampToValueAtTime(55, now + 0.2);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(0.15, now + 0.02);
    gain.gain.linearRampToValueAtTime(0.0001, now + 0.2);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.2);
  }

  function playSuccessSound() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(520, now + 1.8);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(0.35, now + 0.5);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.5);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 2.5);
  }

  function playTypeTick() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1400 + Math.random() * 400, now);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(0.02, now + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.06);
  }

  function playDeleteTick() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(700 + Math.random() * 200, now);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(0.015, now + 0.004);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.04);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.05);
  }

  function playEscalatingGlitchSound(level) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const intensity = level / MAX_GLITCH_LEVEL;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    const startFreq = 200 + intensity * 900;
    const endFreq = 40 + Math.random() * 60;
    osc.frequency.setValueAtTime(startFreq, now);
    osc.frequency.linearRampToValueAtTime(endFreq, now + 0.35);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(0.12 + intensity * 0.22, now + 0.02);
    gain.gain.linearRampToValueAtTime(0.0001, now + 0.3 + intensity * 0.35);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.35 + intensity * 0.4);

    if (intensity > 0.4) {
      const osc2 = audioCtx.createOscillator(), gain2 = audioCtx.createGain();
      osc2.type = 'square';
      osc2.frequency.setValueAtTime(1800 + Math.random() * 1400, now);
      gain2.gain.setValueAtTime(0.0001, now);
      gain2.gain.linearRampToValueAtTime(0.03 + intensity * 0.04, now + 0.01);
      gain2.gain.linearRampToValueAtTime(0.0001, now + 0.15 + intensity * 0.15);
      osc2.connect(gain2); gain2.connect(audioCtx.destination);
      osc2.start(now); osc2.stop(now + 0.2 + intensity * 0.2);
    }
  }

  window.addEventListener('click', initAudio);
  window.addEventListener('keydown', initAudio);
  window.addEventListener('touchstart', initAudio);
  window.addEventListener('mousemove', initAudio, { once: true });

  // ===================================================================
  // CANVAS STARFIELD
  // ===================================================================
  const canvas = document.getElementById('space-canvas');
  const ctx = canvas.getContext('2d');
  let width = canvas.width = window.innerWidth;
  let height = canvas.height = window.innerHeight;
  window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  });

  const angleRad = (180 + 35) * Math.PI / 180;
  const moveSpeed = 0.12;
  const vx = Math.cos(angleRad) * moveSpeed;
  const vy = Math.sin(angleRad) * moveSpeed;

  const STAR_COUNT = 300;
  let stars = [];
  const starColors = [
    { r: 255, g: 255, b: 255 },
    { r: 235, g: 242, b: 255 },
    { r: 255, g: 245, b: 220 },
    { r: 210, g: 230, b: 255 }
  ];

  function initStars() {
    stars = [];
    for (let i = 0; i < STAR_COUNT; i++) {
      const color = starColors[Math.floor(Math.random() * starColors.length)];
      stars.push({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.random() < 0.85 ? Math.random() * 1.2 + 0.3 : Math.random() * 2.2 + 1.2,
        color: color,
        baseAlpha: Math.random() * 0.5 + 0.3,
        twinkleSpeed: Math.random() * 0.015 + 0.005,
        twinklePhase: Math.random() * Math.PI * 2,
        hasFlare: Math.random() < 0.15
      });
    }
  }

  let isGlitching = false, glitchDuration = 0;
  let thanksPhase = false;
  let glitchLevel = 0;
  const MAX_GLITCH_LEVEL = 8;
  let blackoutDone = false;

    function renderStarfield(targetCtx, offsetX = 0, offsetY = 0, colorOverride = null) {
      for (let i = 0; i < stars.length; i++) {
        const star = stars[i];
        const currentAlpha = Math.max(0.1, star.baseAlpha + Math.sin(star.twinklePhase) * 0.25);
        const x = star.x + offsetX, y = star.y + offsetY;
        targetCtx.save();
        if (colorOverride) {
          targetCtx.beginPath();
          targetCtx.fillStyle = `rgba(${colorOverride.r}, ${colorOverride.g}, ${colorOverride.b}, ${currentAlpha})`;
          targetCtx.arc(x, y, star.radius, 0, Math.PI * 2);
          targetCtx.fill();
        } else {
          const rad = star.radius;
          const g = targetCtx.createRadialGradient(x, y, 0, x, y, rad * 2.5);
          g.addColorStop(0, `rgba(${star.color.r}, ${star.color.g}, ${star.color.b}, ${currentAlpha})`);
          g.addColorStop(0.4, `rgba(${star.color.r}, ${star.color.g}, ${star.color.b}, ${currentAlpha * 0.5})`);
          g.addColorStop(1, `rgba(${star.color.r}, ${star.color.g}, ${star.color.b}, 0)`);
          targetCtx.beginPath();
          targetCtx.fillStyle = g;
          targetCtx.arc(x, y, rad * 2.5, 0, Math.PI * 2);
          targetCtx.fill();
          if (star.hasFlare && star.radius > 1.5) {
            targetCtx.strokeStyle = `rgba(${star.color.r}, ${star.color.g}, ${star.color.b}, ${currentAlpha * 0.35})`;
            targetCtx.lineWidth = 0.5;
            const fl = star.radius * 4;
            targetCtx.beginPath();
            targetCtx.moveTo(x - fl, y); targetCtx.lineTo(x + fl, y);
            targetCtx.moveTo(x, y - fl); targetCtx.lineTo(x, y + fl);
            targetCtx.stroke();
          }
        }
        targetCtx.restore();
      }
    }

    function renderGlitchSmall() {
      const ro = (Math.random() - 0.5) * 18;
      const bo = (Math.random() - 0.5) * 18;
      ctx.globalCompositeOperation = 'screen';
      renderStarfield(ctx, ro, (Math.random() - 0.5) * 4, { r: 255, g: 30, b: 60 });
      renderStarfield(ctx, 0, 0, { r: 30, g: 255, b: 120 });
      renderStarfield(ctx, bo, (Math.random() - 0.5) * 4, { r: 30, g: 120, b: 255 });
      ctx.globalCompositeOperation = 'source-over';
      const sliceCount = Math.floor(Math.random() * 4) + 1;
      for (let i = 0; i < sliceCount; i++) {
        const sy = Math.random() * height;
        const sh = Math.random() * 30 + 5;
        const sx = (Math.random() - 0.5) * 25;
        ctx.drawImage(canvas, 0, sy, width, sh, sx, sy, width, sh);
      }
    }

    function renderGlitchEscalating() {
      const intensity = glitchLevel / MAX_GLITCH_LEVEL;
      const rgbAmt = 18 + intensity * 90;
      const ro = (Math.random() - 0.5) * rgbAmt;
      const bo = (Math.random() - 0.5) * rgbAmt;

      ctx.globalCompositeOperation = 'screen';
      renderStarfield(ctx, ro, (Math.random() - 0.5) * (4 + intensity * 20), { r: 255, g: 30, b: 60 });
      renderStarfield(ctx, 0, 0, { r: 30, g: 255, b: 120 });
      renderStarfield(ctx, bo, (Math.random() - 0.5) * (4 + intensity * 20), { r: 30, g: 120, b: 255 });
      ctx.globalCompositeOperation = 'source-over';

      const sliceCount = Math.floor(Math.random() * (4 + intensity * 25)) + 1;
      for (let i = 0; i < sliceCount; i++) {
        const sy = Math.random() * height;
        const sh = Math.random() * (30 + intensity * 120) + 5;
        const sx = (Math.random() - 0.5) * (25 + intensity * 180);
        ctx.drawImage(canvas, 0, sy, width, sh, sx, sy, width, sh);
      }

      if (intensity > 0.3) {
        ctx.globalAlpha = 0.15 + intensity * 0.25;
        for (let y = 0; y < height; y += 3) {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
          ctx.fillRect(0, y, width, 1);
        }
        ctx.globalAlpha = 1;
      }

      if (Math.random() < intensity * 0.45) {
        ctx.fillStyle = `rgba(0, 0, 0, ${Math.random() * intensity * 0.85})`;
        ctx.fillRect(0, 0, width, height);
      }

      if (Math.random() < intensity * 0.6) {
        const dots = Math.floor(60 * intensity);
        for (let n = 0; n < dots; n++) {
          ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.35})`;
          ctx.fillRect(Math.random() * width, Math.random() * height, 2, 2);
        }
      }

      if (intensity > 0.5 && Math.random() < 0.4) {
        const blocks = Math.floor(intensity * 6);
        for (let b = 0; b < blocks; b++) {
          const bx = Math.random() * width;
          const by = Math.random() * height;
          const bw = Math.random() * 200 * intensity;
          const bh = Math.random() * 40 * intensity;
          ctx.fillStyle = 'rgba(0, 0, 0, 0.9)';
          ctx.fillRect(bx, by, bw, bh);
        }
      }
    }

    function animate() {
      for (let i = 0; i < stars.length; i++) {
        const s = stars[i];
        s.x += vx; s.y += vy; s.twinklePhase += s.twinkleSpeed;
        if (s.x < -10) s.x = width + 10;
        if (s.y < -10) s.y = height + 10;
      }

      ctx.clearRect(0, 0, width, height);

      if (glitchLevel > 0) {
        renderGlitchEscalating();
      } else if (isGlitching && glitchDuration > 0) {
        glitchDuration--;
        renderGlitchSmall();
        if (glitchDuration <= 0) isGlitching = false;
      } else {
        renderStarfield(ctx);
      }

      if (glitchLevel > 0 && !blackoutDone) {
        const intensity = glitchLevel / MAX_GLITCH_LEVEL;
        const shake = intensity * 10;
        screen2.style.transform =
          `translate(${(Math.random() - 0.5) * shake}px, ${(Math.random() - 0.5) * shake}px)`;
        if (intensity > 0.5) {
          screen2.style.opacity = 0.65 + Math.random() * 0.35;
        }
      }

      requestAnimationFrame(animate);
    }
    initStars();
    animate();

    // ===================================================================
    // INPUT & DISPLAY
    // ===================================================================
    const inputEl = document.getElementById('codeInput');
    const displayText = document.getElementById('displayText');
    const errorEl = document.getElementById('errorMsg');
    const screen1 = document.getElementById('screen1');
    const screen2 = document.getElementById('screen2');
    const typedTarget = document.getElementById('typedTarget');
    const typeCursor = document.getElementById('typeCursor');

    function syncDisplay() {
      const val = inputEl.value;
      if (val.length === 0) {
        displayText.textContent = '......';
        displayText.classList.add('placeholder');
      } else {
        displayText.textContent = val;
        displayText.classList.remove('placeholder');
      }
    }
    inputEl.addEventListener('input', syncDisplay);
    syncDisplay();

    screen1.addEventListener('click', () => {
      if (!transitioned) inputEl.focus();
    });

    function triggerGlitch() {
      isGlitching = true; glitchDuration = 20;
      playGlitchSound();
      errorEl.classList.add('visible');
      setTimeout(() => errorEl.classList.remove('visible'), 1800);
    }

    // ===================================================================
    // STATE MACHINE
    // ===================================================================
    const phrases = [
      "Do you believe what you see?",
      "Do we need secret?",
      "Thanks."
    ];

    let phraseIndex = 0;
    let mode = 'delete';
    let state = 'idle';
    let transitioned = false;

    function setCursorReady(isReady) {
      if (isReady) typeCursor.classList.add('ready');
      else typeCursor.classList.remove('ready');
    }

    function typeText(text, onDone) {
      state = 'typing';
      setCursorReady(false);
      typeCursor.classList.remove('hidden');
      typeCursor.classList.remove('finished');
      let i = 0;
      function step() {
        if (i >= text.length) {
          state = 'idle';
          setCursorReady(true);
          onDone && onDone();
          return;
        }
        const ch = text.charAt(i);
        const span = document.createElement('span');
        span.className = 'typed-char';
        span.textContent = ch === ' ' ? '\u00A0' : ch;
        typedTarget.appendChild(span);
        if (ch !== ' ') playTypeTick();
        i++;
        let delay = 85 + Math.random() * 55;
        if (ch === ' ') delay = 60 + Math.random() * 30;
        if (ch === ',' || ch === '.') delay += 180;
        setTimeout(step, delay);
      }
      setTimeout(step, 300);
    }

    function deleteText(onDone) {
      state = 'deleting';
      setCursorReady(false);
      function step() {
        const last = typedTarget.lastElementChild;
        if (!last) { state = 'idle'; onDone && onDone(); return; }
        last.style.transition = 'opacity 0.12s ease, transform 0.12s ease, filter 0.12s ease';
        last.style.opacity = '0';
        last.style.transform = 'translateY(-8px) scale(0.7)';
        last.style.filter = 'blur(3px)';
        setTimeout(() => { if (last.parentNode) last.remove(); }, 130);
        playDeleteTick();
        setTimeout(step, 55);
      }
      step();
    }

    function escalateGlitch() {
      if (blackoutDone) return;
      glitchLevel = Math.min(glitchLevel + 1, MAX_GLITCH_LEVEL);
      playEscalatingGlitchSound(glitchLevel);
      if (glitchLevel >= MAX_GLITCH_LEVEL) {
        setTimeout(triggerFullBlackout, 900);
      }
    }

    function triggerFullBlackout() {
      if (blackoutDone) return;
      blackoutDone = true;
      typeCursor.classList.add('hidden');

      const blackout = document.createElement('div');
      blackout.style.cssText = `
        position: fixed; inset: 0;
        background: #000000;
        z-index: 9999999;
        opacity: 0;
        transition: opacity 2.2s cubic-bezier(0.6, 0, 0.9, 0.3);
        pointer-events: auto;
        cursor: default;
      `;
      document.body.appendChild(blackout);
      requestAnimationFrame(() => { blackout.style.opacity = '1'; });

      if (audioCtx && audioCtx.state === 'running') {
        setTimeout(() => { try { audioCtx.close(); } catch (e) {} }, 2200);
      }
    }

    // ===================================================================
    // KLIK DI SCREEN2
    // ===================================================================
    screen2.addEventListener('click', () => {
      if (thanksPhase) {
        escalateGlitch();
        return;
      }

      if (state !== 'idle') return;
      if (phraseIndex > phrases.length) return;

      if (mode === 'delete') {
        deleteText(() => {
          mode = 'type';
          setCursorReady(true);
        });
      } else {
        if (phraseIndex >= phrases.length) return;
        const nextText = phrases[phraseIndex];
        const isLast = (phraseIndex === phrases.length - 1);
        phraseIndex++;

        typeText(nextText, () => {
          if (isLast) {
            thanksPhase = true;
            setCursorReady(true);
          } else {
            mode = 'delete';
          }
        });
      }
    });

    // ===================================================================
    // ENTER → MULAI
    // ===================================================================
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !transitioned) {
        const value = inputEl.value.trim();
        if (value.toLowerCase() === 'phi') {
          transitioned = true;
          playSuccessSound();
          errorEl.classList.remove('visible');
          inputEl.blur();
          screen1.classList.add('hidden');
          screen2.classList.add('active');
          setTimeout(() => {
            typeText('Are You Sure?', () => { mode = 'delete'; });
          }, 900);
        } else {
          triggerGlitch();
        }
      }
    });

    window.addEventListener('load', () => inputEl.focus());
  </script>
</body>
</html>
