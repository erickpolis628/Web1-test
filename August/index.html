<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>august</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #000;
    color: #fff;
    font-family: Georgia, 'Times New Roman', serif;
    overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  #scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
    display: block;
  }

  .stage {
    position: relative;
    z-index: 2;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 80px;
    padding: 40px 24px;
  }

  #lyrics {
    position: relative;
    width: 100%;
    max-width: 780px;
    height: 140px;
  }

  .line {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100%;
    text-align: center;
    font-size: clamp(1.05rem, 2.6vw, 1.7rem);
    line-height: 1.5;
    letter-spacing: 0.015em;
    color: #f6f6f6;
    transform: translate(-50%, -50%);
    opacity: 0;
    transition: opacity 1.4s ease;
    text-shadow:
      0 0 40px rgba(255, 255, 255, 0.18),
      0 2px 20px rgba(0, 0, 0, 0.9);
    pointer-events: none;
    will-change: opacity;
  }

  .line.active { opacity: 1; }
  .line.past   { opacity: 0; }

  #playBtn {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.22);
    background: rgba(255,255,255,0.03);
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.35s ease, border-color 0.35s ease,
                transform 0.25s ease, box-shadow 0.35s ease;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    outline: none;
  }
  #playBtn:hover {
    background: rgba(255,255,255,0.09);
    border-color: rgba(255,255,255,0.45);
    box-shadow: 0 0 34px rgba(180, 200, 235, 0.18);
  }
  #playBtn:active { transform: scale(0.96); }
  #playBtn svg { width: 22px; height: 22px; fill: #fff; }
  #playBtn .pause-icon { display: none; }
  #playBtn.playing .play-icon { display: none; }
  #playBtn.playing .pause-icon { display: block; }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div class="stage">
  <div id="lyrics">
    <div class="line" id="lineA"></div>
    <div class="line" id="lineB"></div>
  </div>

  <button id="playBtn" aria-label="Play">
    <svg class="play-icon" viewBox="0 0 24 24"><polygon points="7,4 20,12 7,20"/></svg>
    <svg class="pause-icon" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
  </button>
</div>

<audio id="audio" src="August.m4a" preload="metadata"></audio>

<script>
/* ============================================================
   SETUP
   ============================================================ */
const canvas = document.getElementById('scene');
const ctx    = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
let windTime = 0;

/* ============================================================
   SPRITE: DUST (bulat lembut)
   ============================================================ */
function makeDustSprite() {
  const s = 64;
  const c = document.createElement('canvas');
  c.width = c.height = s * 2;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(s, s, 0, s, s, s);
  grad.addColorStop(0.00, 'rgba(255,255,255,1)');
  grad.addColorStop(0.25, 'rgba(255,255,255,0.55)');
  grad.addColorStop(0.55, 'rgba(255,255,255,0.15)');
  grad.addColorStop(1.00, 'rgba(255,255,255,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, s * 2, s * 2);
  return c;
}
const dustSprite = makeDustSprite();

/* ============================================================
   SPRITE: FIREFLY (glow kuning-hangat)
   ============================================================ */
function makeFireflySprite() {
  const s = 64;
  const c = document.createElement('canvas');
  c.width = c.height = s * 2;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(s, s, 0, s, s, s);
  grad.addColorStop(0.00, 'rgba(255, 255, 220, 1)');
  grad.addColorStop(0.08, 'rgba(255, 245, 170, 0.95)');
  grad.addColorStop(0.22, 'rgba(255, 220, 100, 0.55)');
  grad.addColorStop(0.45, 'rgba(255, 190, 60, 0.18)');
  grad.addColorStop(0.75, 'rgba(255, 170, 40, 0.04)');
  grad.addColorStop(1.00, 'rgba(255, 170, 40, 0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, s * 2, s * 2);
  return c;
}
const fireflySprite = makeFireflySprite();

/* ============================================================
   SPRITE: LEAF (bentuk daun realistis, 5 variasi warna)
   ============================================================ */
function makeLeafSprite(colorDark, colorLight, veinColor) {
  const s = 96;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  g.translate(s / 2, s / 2);

  const halfW = s * 0.34;
  const halfH = s * 0.24;

  // bentuk daun: lensa (runcing di kedua ujung)
  g.beginPath();
  g.moveTo(-halfW, 0);
  g.bezierCurveTo(-halfW * 0.55, -halfH * 1.15,
                   halfW * 0.55, -halfH * 1.15,
                   halfW, 0);
  g.bezierCurveTo( halfW * 0.55,  halfH * 1.15,
                  -halfW * 0.55,  halfH * 1.15,
                  -halfW, 0);
  g.closePath();

  // gradien 3D: sisi atas lebih terang (kena cahaya)
  const grad = g.createLinearGradient(0, -halfH, 0, halfH);
  grad.addColorStop(0.00, colorLight);
  grad.addColorStop(0.45, colorDark);
  grad.addColorStop(1.00, colorDark);
  g.fillStyle = grad;
  g.fill();

  // clip biar vein nggak keluar
  g.save();
  g.clip();

  // tulang daun utama
  g.strokeStyle = veinColor;
  g.lineWidth = 1.4;
  g.beginPath();
  g.moveTo(-halfW, 0);
  g.lineTo( halfW * 0.92, 0);
  g.stroke();

  // tulang daun samping
  g.lineWidth = 0.9;
  const veins = 5;
  for (let i = 1; i <= veins; i++) {
    const t = i / (veins + 1);
    const px = -halfW + t * (halfW * 1.7);
    // atas
    g.beginPath();
    g.moveTo(px, 0);
    g.quadraticCurveTo(px + halfW * 0.10, -halfH * 0.55,
                        px + halfW * 0.22, -halfH * 0.95);
    g.stroke();
    // bawah
    g.beginPath();
    g.moveTo(px, 0);
    g.quadraticCurveTo(px + halfW * 0.10,  halfH * 0.55,
                        px + halfW * 0.22,  halfH * 0.95);
    g.stroke();
  }

  g.restore();

  // garis tepi tipis (bayangan)
  g.strokeStyle = 'rgba(0,0,0,0.35)';
  g.lineWidth = 1;
  g.beginPath();
  g.moveTo(-halfW, 0);
  g.bezierCurveTo(-halfW * 0.55, -halfH * 1.15,
                   halfW * 0.55, -halfH * 1.15,
                   halfW, 0);
  g.bezierCurveTo( halfW * 0.55,  halfH * 1.15,
                  -halfW * 0.55,  halfH * 1.15,
                  -halfW, 0);
  g.stroke();

  // tangkai
  g.strokeStyle = colorDark;
  g.lineWidth = 1.6;
  g.beginPath();
  g.moveTo(-halfW, 0);
  g.lineTo(-halfW - s * 0.10, s * 0.02);
  g.stroke();

  return c;
}

const leafSprites = [
  makeLeafSprite('#7A2E14', '#B85A2C', 'rgba(60,20,8,0.55)'),   // rust
  makeLeafSprite('#8B4513', '#CE8B45', 'rgba(70,35,10,0.55)'),  // amber
  makeLeafSprite('#5C2010', '#9E3D1F', 'rgba(40,10,5,0.55)'),   // dark red
  makeLeafSprite('#6B4A1E', '#B58A3C', 'rgba(50,30,10,0.55)'),  // gold-brown
  makeLeafSprite('#7A3812', '#C46A2E', 'rgba(60,25,8,0.55)')    // burnt orange
];

/* ============================================================
   PARTIKEL
   ============================================================ */
let dust = [];
let fireflies = [];
let leaves = [];

function makeDust(startX) {
  const depth = Math.random();
  let size, opacity, speed;
  if (depth < 0.62) {
    size = 0.5 + Math.random() * 1.1;
    opacity = 0.14 + Math.random() * 0.22;
    speed = 0.45 + Math.random() * 0.7;
  } else if (depth < 0.9) {
    size = 1.4 + Math.random() * 2.0;
    opacity = 0.22 + Math.random() * 0.30;
    speed = 0.85 + Math.random() * 1.05;
  } else {
    size = 3.0 + Math.random() * 4.0;
    opacity = 0.10 + Math.random() * 0.18;
    speed = 1.30 + Math.random() * 1.6;
  }
  return {
    x: startX !== undefined ? startX : W + 30 + Math.random() * 180,
    y: Math.random() * H,
    size, opacity, speed,
    vy: (Math.random() - 0.5) * 0.18,
    wobblePhase: Math.random() * Math.PI * 2,
    wobbleSpeed: 0.5 + Math.random() * 1.3,
    wobbleAmp: 0.3 + Math.random() * 1.4,
    twinklePhase: Math.random() * Math.PI * 2,
    twinkleSpeed: 0.8 + Math.random() * 2.6
  };
}

function makeFirefly() {
  return {
    x: Math.random() * W,
    y: Math.random() * H,
    // tiap firefly punya pusat goyang
    baseX: Math.random() * W,
    baseY: Math.random() * H,
    driftAngle: Math.random() * Math.PI * 2,
    driftSpeed: 0.06 + Math.random() * 0.12,
    wanderPhase1: Math.random() * Math.PI * 2,
    wanderPhase2: Math.random() * Math.PI * 2,
    wanderSpeed1: 0.35 + Math.random() * 0.5,
    wanderSpeed2: 0.28 + Math.random() * 0.45,
    pulsePhase: Math.random() * Math.PI * 2,
    pulseSpeed: 0.5 + Math.random() * 1.0,
    size: 14 + Math.random() * 20,       // ukuran glow
    baseOpacity: 0.55 + Math.random() * 0.45
  };
}

function makeLeaf(startX) {
  return {
    x: startX !== undefined ? startX : W + 40 + Math.random() * 300,
    y: -40 - Math.random() * 200,
    fallSpeed: 22 + Math.random() * 26,       // px/detik
    driftSpeed: 22 + Math.random() * 30,      // px/detik (ke kiri)
    swayPhase: Math.random() * Math.PI * 2,
    swaySpeed: 0.6 + Math.random() * 0.9,
    swayAmp: 18 + Math.random() * 30,
    angle: Math.random() * Math.PI * 2,
    angleSpeed: (Math.random() - 0.5) * 0.9,  // rad/detik
    flipPhase: Math.random() * Math.PI * 2,   // untuk efek 3D flip
    flipSpeed: 0.7 + Math.random() * 1.4,
    size: 22 + Math.random() * 26,
    opacity: 0.55 + Math.random() * 0.40,
    sprite: leafSprites[Math.floor(Math.random() * leafSprites.length)]
  };
}

function initParticles() {
  // dust
  const dustCount = Math.min(300, Math.max(120, Math.floor(W * H / 6800)));
  dust = new Array(dustCount);
  for (let i = 0; i < dustCount; i++) {
    const p = makeDust();
    p.x = Math.random() * (W + 200);
    dust[i] = p;
  }

  // fireflies — sedikit saja biar special
  const ffCount = Math.max(7, Math.min(14, Math.floor(W / 150)));
  fireflies = new Array(ffCount);
  for (let i = 0; i < ffCount; i++) fireflies[i] = makeFirefly();

  // leaves — sedikit, lambat, anggun
  const leafCount = Math.max(6, Math.min(11, Math.floor(W / 180)));
  leaves = new Array(leafCount);
  for (let i = 0; i < leafCount; i++) {
    const p = makeLeaf();
    p.y = Math.random() * H; // sebar di awal
    p.x = Math.random() * (W + 300);
    leaves[i] = p;
  }
}

/* ============================================================
   RESIZE
   ============================================================ */
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  initParticles();
}
window.addEventListener('resize', resize);
resize();

/* ============================================================
   ANIMATION LOOP
   ============================================================ */
let lastT = performance.now();

function animate(now) {
  const dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;
  windTime += dt;

  // gust angin global
  const gust = 1
    + Math.sin(windTime * 0.32) * 0.35
    + Math.sin(windTime * 0.11 + 1.7) * 0.25
    + Math.sin(windTime * 0.83 + 3.1) * 0.10;

  ctx.clearRect(0, 0, W, H);

  /* ---------- 1. LEAVES (paling belakang) ---------- */
  for (let i = 0; i < leaves.length; i++) {
    const p = leaves[i];
    const sway = Math.sin(windTime * p.swaySpeed + p.swayPhase) * p.swayAmp;

    p.x -= p.driftSpeed * gust * dt;
    p.y += p.fallSpeed * dt;
    p.angle += p.angleSpeed * dt;
    p.flipPhase += p.flipSpeed * dt;

    // recycle kalau keluar layar
    if (p.x < -80 || p.y > H + 80) {
      leaves[i] = makeLeaf();
      continue;
    }

    // flip 3D semu: scaleX berubah dengan cos
    const flipX = Math.cos(p.flipPhase);
    // bayangan sisi flip: kalau flipX negatif, berarti sisi belakang
    const brightness = 0.75 + 0.25 * Math.abs(flipX);

    ctx.save();
    ctx.translate(p.x + sway, p.y);
    ctx.rotate(p.angle);
    ctx.scale(flipX, 1);

    ctx.globalAlpha = p.opacity * brightness;
    ctx.drawImage(p.sprite, -p.size / 2, -p.size / 2, p.size, p.size);

    ctx.restore();
  }

  /* ---------- 2. DUST (tengah) ---------- */
  for (let i = 0; i < dust.length; i++) {
    const p = dust[i];
    p.x -= p.speed * gust * 60 * dt;
    p.y += p.vy * 60 * dt;

    const wobble = Math.sin(windTime * p.wobbleSpeed + p.wobblePhase) * p.wobbleAmp;
    const twinkle = 0.72 + Math.sin(windTime * p.twinkleSpeed + p.twinklePhase) * 0.28;

    if (p.x < -30) {
      dust[i] = makeDust(W + 30 + Math.random() * 120);
      continue;
    }
    if (p.y < -30) p.y = H + 20;
    else if (p.y > H + 30) p.y = -20;

    ctx.globalAlpha = p.opacity * twinkle;
    const r = p.size;
    ctx.drawImage(dustSprite, p.x - r, p.y + wobble - r, r * 2, r * 2);
  }
  ctx.globalAlpha = 1;

  /* ---------- 3. FIREFLIES (paling depan, mode glow) ---------- */
  ctx.globalCompositeOperation = 'lighter';

  for (let i = 0; i < fireflies.length; i++) {
    const p = fireflies[i];

    // wander halus 2D di sekitar titik pusat
    const wx = Math.sin(windTime * p.wanderSpeed1 + p.wanderPhase1) * 60
             + Math.sin(windTime * 0.7 + p.wanderPhase2) * 25;
    const wy = Math.cos(windTime * p.wanderSpeed2 + p.wanderPhase2) * 45
             + Math.cos(windTime * 0.9 + p.wanderPhase1) * 20;

    // sedikit drift ke kiri mengikuti angin
    p.baseX -= p.driftSpeed * gust * dt * 8;

    // wrap kalau keluar
    if (p.baseX < -100) {
      p.baseX = W + 100;
      p.baseY = Math.random() * H;
    }
    if (p.baseY < -100) p.baseY = H + 100;
    else if (p.baseY > H + 100) p.baseY = -100;

    const x = p.baseX + wx;
    const y = p.baseY + wy;

    // pulse nyala-redup lembut
    const pulse = 0.5 + 0.5 * Math.sin(windTime * p.pulseSpeed + p.pulsePhase);
    const alpha = p.baseOpacity * (0.25 + 0.75 * pulse);

    const r = p.size;
    ctx.globalAlpha = alpha;
    ctx.drawImage(fireflySprite, x - r, y - r, r * 2, r * 2);
  }

  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;

  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

/* ============================================================
   AUDIO + LIRIK (fade in/out, satu baris sekaligus)
   ============================================================ */
const audio   = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
const lineA   = document.getElementById('lineA');
const lineB   = document.getElementById('lineB');
const slots   = [lineA, lineB];
let currentSlot = 0;
let lastIndex   = -1;
let lines = [];

function parseLRC(text) {
  const out = [];
  const re = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/;
  text.split(/\r?\n/).forEach(line => {
    const m = line.match(re);
    if (!m) return;
    const t = (+m[1]) * 60 + (+m[2]) + (+m[3].padEnd(3, '0')) / 1000;
    const txt = m[4].trim();
    if (txt) out.push({ time: t, text: txt });
  });
  return out.sort((a, b) => a.time - b.time);
}

function showLine(text) {
  const next = 1 - currentSlot;
  const newEl = slots[next];
  const oldEl = slots[currentSlot];

  newEl.textContent = text;
  newEl.classList.remove('past');
  void newEl.offsetWidth;
  newEl.classList.add('active');

  oldEl.classList.remove('active');
  oldEl.classList.add('past');

  currentSlot = next;
}

function syncLyrics() {
  const t = audio.currentTime;
  let idx = -1;
  for (let i = 0; i < lines.length; i++) {
    if (t >= lines[i].time) idx = i; else break;
  }
  if (idx === lastIndex) return;
  lastIndex = idx;
  if (idx < 0) return;
  showLine(lines[idx].text);
}

audio.addEventListener('timeupdate', syncLyrics);

playBtn.addEventListener('click', () => {
  if (audio.paused) audio.play();
  else audio.pause();
});

audio.addEventListener('play',  () => playBtn.classList.add('playing'));
audio.addEventListener('pause', () => playBtn.classList.remove('playing'));
audio.addEventListener('ended', () => {
  playBtn.classList.remove('playing');
  lastIndex = -1;
  slots.forEach(s => s.classList.remove('active', 'past'));
});

audio.addEventListener('seeked', () => {
  if (audio.currentTime < 0.3) {
    lastIndex = -1;
    slots.forEach(s => s.classList.remove('active', 'past'));
  }
});

fetch('August.lrc', { cache: 'no-store' })
  .then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  })
  .then(txt => { lines = parseLRC(txt); })
  .catch(err => console.warn('Gagal load August.lrc:', err.message));
</script>
</body>
</html>
