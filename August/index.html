<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>august</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #000;
    color: #fff;
    font-family: Georgia, 'Times New Roman', serif;
    overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  #dust {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
    display: block;
  }

  .stage {
    position: relative;
    z-index: 2;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 70px;
    padding: 40px 24px;
  }

  #lyrics {
    position: relative;
    width: 100%;
    max-width: 720px;
    height: 180px;
  }

  .line {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100%;
    text-align: center;
    font-size: clamp(1.05rem, 2.6vw, 1.75rem);
    line-height: 1.5;
    letter-spacing: 0.015em;
    color: #f6f6f6;
    transform: translate(-50%, calc(-50% + 26px)) scale(0.96);
    opacity: 0;
    transition:
      opacity 0.9s ease,
      transform 1.1s cubic-bezier(0.22, 1, 0.36, 1),
      filter 0.9s ease;
    text-shadow: 0 0 32px rgba(255,255,255,0.14);
    pointer-events: none;
    filter: blur(3px);
    will-change: opacity, transform, filter;
  }

  .line.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
    filter: blur(0);
  }

  .line.past {
    opacity: 0;
    transform: translate(-50%, calc(-50% - 26px)) scale(0.96);
    filter: blur(3px);
  }

  #playBtn {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.22);
    background: rgba(255,255,255,0.03);
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.35s ease, border-color 0.35s ease,
                transform 0.25s ease, box-shadow 0.35s ease;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    outline: none;
  }

  #playBtn:hover {
    background: rgba(255,255,255,0.09);
    border-color: rgba(255,255,255,0.45);
    box-shadow: 0 0 34px rgba(180, 200, 235, 0.18);
  }

  #playBtn:active {
    transform: scale(0.96);
  }

  #playBtn svg {
    width: 22px;
    height: 22px;
    fill: #fff;
    transition: opacity 0.25s ease;
  }

  #playBtn .pause-icon { display: none; }
  #playBtn.playing .play-icon { display: none; }
  #playBtn.playing .pause-icon { display: block; }
</style>
</head>
<body>

<canvas id="dust"></canvas>

<div class="stage">
  <div id="lyrics">
    <div class="line" id="lineA"></div>
    <div class="line" id="lineB"></div>
  </div>

  <button id="playBtn" aria-label="Play">
    <svg class="play-icon" viewBox="0 0 24 24"><polygon points="7,4 20,12 7,20"/></svg>
    <svg class="pause-icon" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
  </button>
</div>

<audio id="audio" src="August.m4a" preload="metadata"></audio>

<script>
/* ============================================================
   DUST PARTICLES — angin dari kanan ke kiri
   ============================================================ */
const canvas = document.getElementById('dust');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;

// Sprite debu sekali buat — bulat lembut (radial gradient)
function makeDustSprite() {
  const s = 64;
  const c = document.createElement('canvas');
  c.width = c.height = s * 2;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(s, s, 0, s, s, s);
  grad.addColorStop(0.00, 'rgba(255,255,255,1)');
  grad.addColorStop(0.25, 'rgba(255,255,255,0.55)');
  grad.addColorStop(0.55, 'rgba(255,255,255,0.15)');
  grad.addColorStop(1.00, 'rgba(255,255,255,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, s * 2, s * 2);
  return c;
}
const sprite = makeDustSprite();

let particles = [];
let windTime = 0;

function makeParticle(startX) {
  // 3 lapisan kedalaman biar ada depth-of-field
  const depth = Math.random();
  let size, opacity, speed;

  if (depth < 0.62) {
    // jauh — kecil, tajam, banyak
    size    = 0.5 + Math.random() * 1.1;
    opacity = 0.14 + Math.random() * 0.22;
    speed   = 0.45 + Math.random() * 0.7;
  } else if (depth < 0.9) {
    // tengah
    size    = 1.4 + Math.random() * 2.0;
    opacity = 0.22 + Math.random() * 0.30;
    speed   = 0.85 + Math.random() * 1.05;
  } else {
    // dekat — besar, lembut, jarang
    size    = 3.0 + Math.random() * 4.0;
    opacity = 0.10 + Math.random() * 0.18;
    speed   = 1.30 + Math.random() * 1.6;
  }

  return {
    x: startX !== undefined ? startX : W + 30 + Math.random() * 180,
    y: Math.random() * H,
    size, opacity, speed,
    vy: (Math.random() - 0.5) * 0.18,           // hanyut vertikal halus
    wobblePhase: Math.random() * Math.PI * 2,    // fase goyangan
    wobbleSpeed: 0.5 + Math.random() * 1.3,
    wobbleAmp:   0.3 + Math.random() * 1.4,
    twinklePhase: Math.random() * Math.PI * 2,   // kilau opacity
    twinkleSpeed: 0.8 + Math.random() * 2.6
  };
}

function initParticles() {
  const density = Math.min(300, Math.max(120, Math.floor(W * H / 6800)));
  particles = new Array(density);
  for (let i = 0; i < density; i++) {
    const p = makeParticle();
    p.x = Math.random() * (W + 200); // sebar merata di awal
    particles[i] = p;
  }
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  initParticles();
}
window.addEventListener('resize', resize);
resize();

let lastT = performance.now();

function animate(now) {
  // delta time biar konsisten di semua refresh rate
  const dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;
  windTime += dt;

  // gust: kecepatan angin naik-turun lembut biar tidak monoton
  const gust = 1
    + Math.sin(windTime * 0.32) * 0.35
    + Math.sin(windTime * 0.11 + 1.7) * 0.25
    + Math.sin(windTime * 0.83 + 3.1) * 0.10;

  ctx.clearRect(0, 0, W, H);

  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];

    // gerak horizontal (kanan → kiri)
    p.x -= p.speed * gust * 60 * dt;

    // hanyut vertikal
    p.y += p.vy * 60 * dt;

    // goyangan tegak lurus arah angin
    const wobble = Math.sin(windTime * p.wobbleSpeed + p.wobblePhase) * p.wobbleAmp;

    // kelip opacity halus
    const twinkle = 0.72 + Math.sin(windTime * p.twinkleSpeed + p.twinklePhase) * 0.28;

    // recycle saat keluar layar kiri
    if (p.x < -30) {
      particles[i] = makeParticle(W + 30 + Math.random() * 120);
      continue;
    }
    // wrap vertikal
    if (p.y < -30) p.y = H + 20;
    else if (p.y > H + 30) p.y = -20;

    const dx = p.x;
    const dy = p.y + wobble;
    const a  = p.opacity * twinkle;
    const r  = p.size;

    ctx.globalAlpha = a;
    ctx.drawImage(sprite, dx - r, dy - r, r * 2, r * 2);
  }

  ctx.globalAlpha = 1;
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

/* ============================================================
   AUDIO + SINKRONISASI LIRIK (satu baris sekaligus)
   ============================================================ */
const audio   = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
const lineA   = document.getElementById('lineA');
const lineB   = document.getElementById('lineB');
const slots   = [lineA, lineB];
let currentSlot = 0;
let lastIndex   = -1;
let lines = [];

function parseLRC(text) {
  const out = [];
  const re = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/;
  text.split(/\r?\n/).forEach(line => {
    const m = line.match(re);
    if (!m) return;
    const t = (+m[1]) * 60 + (+m[2]) + (+m[3].padEnd(3, '0')) / 1000;
    const txt = m[4].trim();
    if (txt) out.push({ time: t, text: txt });
  });
  return out.sort((a, b) => a.time - b.time);
}

function showLine(text) {
  const next = 1 - currentSlot;
  const newEl = slots[next];
  const oldEl = slots[currentSlot];

  newEl.textContent = text;
  newEl.classList.remove('past');
  // paksa reflow biar transisi dari default state jalan
  void newEl.offsetWidth;
  newEl.classList.add('active');

  oldEl.classList.remove('active');
  oldEl.classList.add('past');

  currentSlot = next;
}

function syncLyrics() {
  const t = audio.currentTime;
  let idx = -1;
  for (let i = 0; i < lines.length; i++) {
    if (t >= lines[i].time) idx = i; else break;
  }
  if (idx === lastIndex) return;
  lastIndex = idx;
  if (idx < 0) return;
  showLine(lines[idx].text);
}

audio.addEventListener('timeupdate', syncLyrics);

playBtn.addEventListener('click', () => {
  if (audio.paused) audio.play();
  else audio.pause();
});

audio.addEventListener('play',  () => playBtn.classList.add('playing'));
audio.addEventListener('pause', () => playBtn.classList.remove('playing'));
audio.addEventListener('ended', () => {
  playBtn.classList.remove('playing');
  lastIndex = -1;
  slots.forEach(s => s.classList.remove('active', 'past'));
});

// kalau user restart dari awal (misal via keyboard), reset
audio.addEventListener('seeked', () => {
  if (audio.currentTime < 0.3) {
    lastIndex = -1;
    slots.forEach(s => s.classList.remove('active', 'past'));
  }
});

/* ============================================================
   LOAD LRC
   ============================================================ */
fetch('August.lrc', { cache: 'no-store' })
  .then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  })
  .then(txt => { lines = parseLRC(txt); })
  .catch(err => console.warn('Gagal load August.lrc:', err.message));
</script>
</body>
</html>
